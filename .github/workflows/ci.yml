name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node and desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - ubuntu-24.04
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm xvfb

      - name: Check
        run: npm run check

      - name: Distribution smoke
        run: node dist/bin/codex-infinite.js --version

      - name: Build desktop installers
        run: npm run desktop:make

      - name: Desktop runtime smoke
        if: runner.os != 'Linux'
        run: npm run desktop:smoke

      - name: Desktop runtime smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run desktop:smoke

  windows-native:
    name: Windows process guard
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Rust format
        run: cargo fmt --manifest-path native/windows-job-wrapper/Cargo.toml -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path native/windows-job-wrapper/Cargo.toml --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --manifest-path native/windows-job-wrapper/Cargo.toml

      - name: Rust release build
        run: cargo build --manifest-path native/windows-job-wrapper/Cargo.toml --release --locked
